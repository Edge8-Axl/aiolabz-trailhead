# The name that shows up in GitHub's "Actions" tab.
name: Hello World

# WHEN should this run? This is the trigger.
# "push" = every time code is pushed to the repo, on any branch.
on:
  push:

# WHAT should it do? One or more jobs.
jobs:
  # "say-hello" is a name we invented for this job. It can be anything.
  say-hello:
    # The runner: a fresh Ubuntu Linux computer, thrown away when done.
    runs-on: ubuntu-latest

    # The ordered list of steps this job runs, top to bottom.
    steps:
      # A step can just run a shell command. "run:" does exactly that.
      - name: Print a greeting
        run: echo "Hello from GitHub Actions! 🎉"

      # Steps run in order and share the same computer, so this runs next.
      - name: Show me where I am
        run: |
          echo "I'm running on this machine:"
          uname -a
          echo "Triggered by a push from: ${{ github.actor }}"
          echo "On branch: ${{ github.ref_name }}"
